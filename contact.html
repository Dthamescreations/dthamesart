<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>D. Thames Creations | Contact & Inquiries</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <a href="index.html" class="logo">D. Thames Creations</a>
        <nav>
            <a href="index.html">Home</a>
            <a href="contact.html" class="active">Contact</a>
        </nav>
    </header>

    <main>
        <section class="contact-container">
            <h2>Get in Touch</h2>
            <p>Have a question about an artwork, or are you interested in a custom commission? Send a message below!</p>

            <!-- Formspree Integration Form -->
            <!-- REPLACE 'YOUR_FORMSPREE_ID' WITH YOUR ACTUAL FORMSPREE FORM ID -->
            <form action="https://formspree.io/f/mvkkanpd" method="POST" class="contact-form">
                
                <div class="form-group">
                    <label for="name">Your Name</label>
                    <input type="text" id="name" name="name" placeholder="Full Name" required>
                </div>

                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" name="email" placeholder="name@example.com" required>
                </div>

                <div class="form-group">
                    <label for="subject">Inquiry Type</label>
                    <select id="subject" name="subject">
                        <option value="General Question">General Question</option>
                        <option value="Artwork Purchase">Purchase Artwork</option>
                        <option value="Custom Commission">Custom Commission Request</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="message">Message</label>
                    <textarea id="message" name="message" rows="6" placeholder="Tell me about the piece you're interested in or your custom commission idea..." required></textarea>
                </div>

                <!-- Formspree Redirect (Optional: Redirects back to home page after submission) -->
                <!-- <input type="hidden" name="_next" value="https://yourusername.github.io/index.html"> -->

                <button type="submit" class="btn btn-submit">Send Message</button>
            </form>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Douglas Thames. All Rights Reserved.</p>
    </footer>

</body>
</html>
